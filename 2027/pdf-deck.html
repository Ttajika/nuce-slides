<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDFスライド</title>
<!--
  pdf-deck.html — PDF をスライドとして表示し、slide-board.js の板書・記録・再生を載せるビューア
    学生:      pdf-deck.html?file=pdf/xxx.pdf          （#5 で 5 ページ目から）
    作成モード: pdf-deck.html?file=pdf/xxx.pdf&author=1
    任意:      &board=board/xxx.board.json            （既定は board/<PDF名>.board.json）
  ?file を付けずに開くと、手元の PDF を選んで開ける（作成・確認用）。
  ページ ID は各ページの文字から作るハッシュ。PDF を差し替えてページが増減しても、
  文字が同じページには同じ板書が付く（そのページの文字を直すと ID が変わる点に注意）。
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- ログイン＋クラウド同期（slide-sync.js がなければ何もしない） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="slide-sync.js"></script>
<script src="slide-board.js"></script>
<style>
:root { --accent:#e94560; --bar:#1a1a2e; --bg:#eef0f3; --ink:#1f2937; --muted:#6b7280; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; overflow:hidden; }
.topbar { position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:10px;
  padding:0 12px; background:var(--bar); color:#fff; z-index:100; }
.topbar-title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.topbar-nav { display:flex; align-items:center; gap:5px; flex-shrink:0; }
.nav-btn, .nav-sel { font:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2); border-radius:5px; padding:4px 9px; cursor:pointer; line-height:1.3; }
.nav-sel { max-width:180px; }
.nav-sel option { color:#000; }
.nav-btn.on { background:var(--accent); border-color:var(--accent); }
#pageInfo { font-size:13px; font-variant-numeric:tabular-nums; min-width:5.5em; text-align:center; }
#drawbar { position:fixed; top:54px; left:12px; z-index:90; display:none; flex-wrap:wrap; gap:5px; align-items:center;
  background:rgba(26,26,46,.94); padding:6px 8px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
#drawbar.show { display:flex; }
#drawbar button { font:inherit; font-size:13px; background:rgba(255,255,255,.1); color:#fff;
  border:1px solid rgba(255,255,255,.25); border-radius:6px; padding:4px 8px; cursor:pointer; }
#drawbar button.on { background:#fff; color:var(--bar); }
#drawbar .sw { width:20px; height:20px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.4); }
#drawbar .sw.on { border-color:#fff; outline:2px solid #fff; }
#stageArea { position:absolute; top:46px; left:0; right:0; bottom:0; }
#stage { position:absolute; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.15); }
#stage canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
#pdfCanvas { z-index:0; }
#drawCanvas { z-index:10; pointer-events:none; }
body.drawing #drawCanvas { pointer-events:auto; cursor:crosshair; }
body.drawing #stage { touch-action:none; }
#opener { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:16px; }
#opener .box { background:#fff; border:2px dashed #c7cbd3; border-radius:14px; padding:32px 28px; max-width:460px;
  text-align:center; line-height:1.8; }
#opener.drag .box { border-color:var(--accent); background:#fff5f7; }
#opener h1 { font-size:18px; margin:0 0 6px; }
#opener label { display:inline-block; margin-top:10px; background:var(--accent); color:#fff; border-radius:8px;
  padding:9px 18px; cursor:pointer; font-weight:700; }
#opener .note { font-size:12.5px; color:var(--muted); margin-top:12px; }
#opener code { background:#f3f4f6; padding:1px 5px; border-radius:4px; }
#loading { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); background:rgba(26,26,46,.9); color:#fff;
  padding:10px 18px; border-radius:8px; font-size:14px; display:none; z-index:50; }
#loading.show { display:block; }
@media (max-width: 640px) {
  .topbar-title { display:none; }
  .nav-sel { max-width:110px; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-title" id="title">PDFスライド</div>
  <div class="topbar-nav">
    <select class="nav-sel" id="secSel" title="セクション" hidden></select>
    <button class="nav-btn" id="prevBtn" title="前へ (←)">◀</button>
    <span id="pageInfo">– / –</span>
    <button class="nav-btn" id="nextBtn" title="次へ (→)">▶</button>
    <button class="nav-btn" id="drawBtn" title="手書き (D)">✏️</button>
    <button class="nav-btn" id="saveBtn" title="自分の書き込みを書き出し">💾</button>
    <label class="nav-btn" title="書き込みを読み込み">📂<input type="file" id="loadInput" accept=".json,application/json" hidden></label>
  </div>
</div>
<div id="drawbar">
  <button data-tool="pen" title="ペン (P)">✏️</button>
  <button data-tool="highlight" title="蛍光ペン (H)">🖍</button>
  <button data-tool="eraser" title="消しゴム (E)">🧽</button>
  <button data-tool="pointer" title="ポインター (L)">🔴</button>
  <button class="sw" data-c="#e94560" style="background:#e94560"></button>
  <button class="sw" data-c="#2563eb" style="background:#2563eb"></button>
  <button class="sw" data-c="#1f2937" style="background:#1f2937"></button>
  <button class="sw" data-c="#16a34a" style="background:#16a34a"></button>
  <button id="undoBtn" title="取り消し (Ctrl/⌘+Z)">↶</button>
  <button id="clearBtn" title="このページの書き込みを全消去">🗑</button>
</div>
<main id="stageArea">
  <div id="stage" hidden><canvas id="pdfCanvas"></canvas><canvas id="drawCanvas"></canvas></div>
  <div id="opener" hidden>
    <div class="box">
      <h1>PDF を開く</h1>
      <div>スライドの PDF をここにドロップするか、選んでください。</div>
      <label>PDF を選ぶ<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden></label>
      <div class="note">公開するときは <code>pdf-deck.html?file=pdf/ファイル名.pdf</code> で開きます。<br>
        板書を作るときは末尾に <code>&amp;author=1</code></div>
    </div>
  </div>
  <div id="loading"></div>
</main>

<script>
'use strict';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const REF_W = 1100;            // 線の太さの基準幅（HTML スライドと同じ）
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

let pdf = null, N = 0, current = 0, pageIds = [], SLIDES = [], SECTIONS = [];
let pageAspect = 9 / 16;       // 高さ / 幅
// 学生データ（HTML スライドと同じ形。座標は 0–1 に正規化して保持）
let notes = {}, strokes = {}, boardStrokes = {}, understanding = {}, bookmarks = {};
let STORAGE_KEY = '';
let drawMode = false, drawTool = 'pen', drawColor = '#e94560', penSeen = false, curStroke = null, pointerPos = null;

function loading(msg) { const el = $('loading'); el.textContent = msg; el.classList.toggle('show', !!msg); }
const deckName = name => name.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|#%&\s]+/g, '_');

/* ── PDF を開く ──────────────────────────────────────────────────────────── */
async function openPdf(src, fileName) {
  $('opener').hidden = true;
  loading('PDF を読み込み中…');
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    pdf = await pdfjsLib.getDocument(src).promise;
  } catch (e) {
    loading(''); $('opener').hidden = false;
    alert('PDF を開けませんでした：' + (e && e.message || e)); return;
  }
  N = pdf.numPages;
  const deck = deckName(fileName);
  document.title = fileName.replace(/\.pdf$/i, '');
  $('title').textContent = document.title;
  STORAGE_KEY = 'beamer_pdf_' + deck;
  pageIds = await computePageIds();
  SLIDES = pageIds.map((id, i) => ({ id, title: 'p.' + (i + 1) }));
  SECTIONS = await readOutline();
  fillSections();
  loadLocal();
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= N) current = h - 1;
  current = Math.max(0, Math.min(N - 1, current));
  loading('');
  $('stage').hidden = false;
  const first = await pdf.getPage(current + 1);
  const vp = first.getViewport({ scale: 1 }); pageAspect = vp.height / vp.width;
  sizeStage();
  showSlide(current);

  if (window.SlideSync) SlideSync.init({
    storageKey: STORAGE_KEY,
    getCanvas: () => ({ width: 1, height: 1 }),   // 座標は既に 0–1
    getState: () => ({ notes, strokes, boardStrokes, understanding, bookmarks, lastSlide: current }),
    applyState: s => {
      if (s.notes) notes = s.notes; if (s.understanding) understanding = s.understanding;
      if (s.bookmarks) bookmarks = s.bookmarks; if (s.strokes) strokes = s.strokes;
      if (s.boardStrokes) boardStrokes = s.boardStrokes;
    },
    saveLocal: ts => saveLocal(ts),
    refresh: () => redrawStrokes(),
  });
  if (window.SlideBoard) SlideBoard.init({
    deck,
    boardUrl: params.get('board') || undefined,
    getCanvas: () => $('drawCanvas'),
    getCurrent: () => current,
    showSlide: i => showSlide(i),
    getSlideCount: () => N,
    getSlideId: i => pageIds[i],
    getSections: () => SECTIONS,
    fixedLayout: false,            // PDF はページの縦横比が固定なので不要
  });
}

// ページ ID：ページの文字（空白を除く）の FNV-1a ハッシュ。文字がほぼ無いページは番号。
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
async function computePageIds() {
  const ids = [], seen = {};
  for (let i = 1; i <= N; i++) {
    if (i === 1 || i % 10 === 0) loading(`ページを解析中… ${i} / ${N}`);
    let txt = '';
    try { const p = await pdf.getPage(i); const tc = await p.getTextContent(); txt = tc.items.map(it => it.str || '').join('').replace(/\s+/g, ''); } catch (e) {}
    let id = txt.length >= 4 ? 'p' + fnv(txt) : 'n' + i;
    if (seen[id] != null) id += '~' + (++seen[id]); else seen[id] = 0;   // 同じ文字のページが複数ある場合
    ids.push(id);
  }
  return ids;
}
// PDF のしおり（Beamer の \section など）→ セクション
async function readOutline() {
  try {
    const ol = await pdf.getOutline(); if (!ol) return [];
    const out = [];
    for (const it of ol) {
      let dest = it.dest;
      if (typeof dest === 'string') dest = await pdf.getDestination(dest);
      if (!Array.isArray(dest) || !dest[0]) continue;
      out.push({ title: it.title, slide: await pdf.getPageIndex(dest[0]) });
    }
    return out.sort((a, b) => a.slide - b.slide);
  } catch (e) { return []; }
}
function fillSections() {
  const sel = $('secSel');
  if (!SECTIONS.length) { sel.hidden = true; return; }
  sel.innerHTML = SECTIONS.map(s => `<option value="${s.slide}">${s.title.replace(/</g, '&lt;')}</option>`).join('');
  sel.hidden = false;
  sel.onchange = () => showSlide(parseInt(sel.value, 10));
}

/* ── 表示 ───────────────────────────────────────────────────────────────── */
function sizeStage() {
  const area = $('stageArea'), st = $('stage');
  const aw = area.clientWidth - 24, ah = area.clientHeight - 24;
  const w = Math.max(120, Math.min(aw, ah / pageAspect)), h = w * pageAspect;
  st.style.width = w + 'px'; st.style.height = h + 'px';
  st.style.left = (area.clientWidth - w) / 2 + 'px'; st.style.top = Math.max(12, (area.clientHeight - h) / 2) + 'px';
  const dc = $('drawCanvas');
  dc.width = Math.round(w); dc.height = Math.round(h);
  redrawStrokes();
}
let renderSeq = 0, renderTask = null;
const off = document.createElement('canvas');
async function renderPage() {
  if (!pdf) return;
  const seq = ++renderSeq;
  const page = await pdf.getPage(current + 1);
  if (seq !== renderSeq) return;
  const vp1 = page.getViewport({ scale: 1 });
  const asp = vp1.height / vp1.width;
  if (Math.abs(asp - pageAspect) > 1e-3) { pageAspect = asp; sizeStage(); }
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const vp = page.getViewport({ scale: parseFloat($('stage').style.width) * dpr / vp1.width });
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} }
  off.width = Math.round(vp.width); off.height = Math.round(vp.height);
  renderTask = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
  try { await renderTask.promise; } catch (e) { if (e && e.name !== 'RenderingCancelledException') console.warn(e); return; }
  if (seq !== renderSeq) return;
  const c = $('pdfCanvas');   // 描き終わってから差し替える（ページ送りで白く点滅しない）
  c.width = off.width; c.height = off.height; c.getContext('2d').drawImage(off, 0, 0);
}

// ページ移動（slide-board.js がこの関数を包んで使うので、グローバル関数のままにしておく）
function showSlide(i) {
  if (!pdf || i < 0 || i >= N) return;
  current = i; curStroke = null; pointerPos = null;
  history.replaceState(null, '', location.pathname + location.search + '#' + (i + 1));
  $('pageInfo').textContent = `${i + 1} / ${N}`;
  if (SECTIONS.length) {
    let v = SECTIONS[0].slide;
    for (const s of SECTIONS) if (i >= s.slide) v = s.slide;
    $('secSel').value = String(v);
  }
  renderPage();
  redrawStrokes();
  scheduleSave();
}
const nextSlide = () => showSlide(current + 1);
const prevSlide = () => showSlide(current - 1);

/* ── 学生の手書き ───────────────────────────────────────────────────────── */
function redrawStrokes() {
  const c = $('drawCanvas'), ctx = c.getContext('2d'), W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  for (const s of strokes[current] || []) {
    const p = s.points; if (!p || !p.length) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = s.size * W / REF_W; ctx.globalAlpha = s.alpha || 1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(p[0].x * W, p[0].y * H);
    for (let k = 1; k < p.length; k++) ctx.lineTo(p[k].x * W, p[k].y * H);
    if (p.length === 1) ctx.lineTo(p[0].x * W + 0.01, p[0].y * H);
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (pointerPos) {
    const x = pointerPos.x * W, y = pointerPos.y * H, k = W / REF_W;
    ctx.beginPath(); ctx.arc(x, y, 12 * k, 0, Math.PI * 2); ctx.fillStyle = 'rgba(233,69,96,0.7)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 5 * k, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  }
}
function normPos(e) {
  const r = $('drawCanvas').getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) / r.width * 10000) / 10000, y: Math.round((e.clientY - r.top) / r.height * 10000) / 10000 };
}
function setDraw(on) {
  drawMode = on;
  document.body.classList.toggle('drawing', on);
  $('drawBtn').classList.toggle('on', on);
  $('drawbar').classList.toggle('show', on);
  if (!on && pointerPos) { pointerPos = null; redrawStrokes(); }
}
function setTool(t) {
  drawTool = t;
  document.querySelectorAll('#drawbar [data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  if (t !== 'pointer' && pointerPos) { pointerPos = null; redrawStrokes(); }
}
function setColor(c) { drawColor = c; document.querySelectorAll('#drawbar .sw').forEach(b => b.classList.toggle('on', b.dataset.c === c)); }
function eraseAt(pt) {
  const c = $('drawCanvas'), W = c.width, H = c.height, arr = strokes[current] || [];
  const keep = arr.filter(s => !s.points.some(p => Math.hypot((p.x - pt.x) * W, (p.y - pt.y) * H) < 12));
  if (keep.length !== arr.length) { strokes[current] = keep; redrawStrokes(); }
}
const stage = $('stage');
stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') { penSeen = true; if (!drawMode) setDraw(true); }   // Pencil を当てたら自動で手書き
  if (!drawMode) return;
  if (e.pointerType === 'touch' && penSeen) return;     // Pencil 使用時は指で書かない
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  const pt = normPos(e);
  if (drawTool === 'pointer') { pointerPos = pt; redrawStrokes(); curStroke = { pointer: true }; return; }
  if (drawTool === 'eraser') { curStroke = { eraser: true }; eraseAt(pt); return; }
  const hl = drawTool === 'highlight';
  curStroke = { color: drawColor, size: hl ? 9 : 3, alpha: hl ? 0.3 : 1, points: [pt] };
  (strokes[current] || (strokes[current] = [])).push(curStroke);
  redrawStrokes();
});
stage.addEventListener('pointermove', e => {
  if (!drawMode) return;
  if (drawTool === 'pointer') {
    if (e.pointerType === 'mouse' || e.pointerType === 'pen' || curStroke) { pointerPos = normPos(e); redrawStrokes(); }
    return;
  }
  if (!curStroke) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (evs.length ? evs : [e])) {
    const pt = normPos(ev);
    if (curStroke.eraser) { eraseAt(pt); continue; }
    const last = curStroke.points[curStroke.points.length - 1];
    if (Math.abs(pt.x - last.x) + Math.abs(pt.y - last.y) < 0.0008) continue;
    curStroke.points.push(pt);
  }
  if (!curStroke.eraser) redrawStrokes();
});
function endStroke(e) {
  if (drawTool === 'pointer' && e.pointerType !== 'mouse' && pointerPos) { pointerPos = null; redrawStrokes(); }
  if (curStroke && !curStroke.pointer) scheduleSave();
  curStroke = null;
}
stage.addEventListener('pointerup', endStroke);
stage.addEventListener('pointercancel', endStroke);
stage.addEventListener('pointerleave', () => { if (drawTool === 'pointer' && pointerPos) { pointerPos = null; redrawStrokes(); } });
function undoStroke() { (strokes[current] || []).pop(); redrawStrokes(); scheduleSave(); }
function clearStrokes() { delete strokes[current]; redrawStrokes(); scheduleSave(); }

/* ── 保存（HTML スライドと同じ形式・同じ仕組み）─────────────────────────── */
let saveTimer = null;
function saveLocal(remoteTs) {
  if (!STORAGE_KEY) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ notes, strokes, boardStrokes, understanding, bookmarks,
      lastSlide: current, updatedAt: remoteTs || Date.now() }));
    if (!remoteTs && window.SlideSync) SlideSync.scheduleRemoteSave();
  } catch (e) {}
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveLocal(), 1000); }
function loadLocal() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (!d) return;
    if (d.notes) notes = d.notes; if (d.strokes) strokes = d.strokes; if (d.boardStrokes) boardStrokes = d.boardStrokes;
    if (d.understanding) understanding = d.understanding; if (d.bookmarks) bookmarks = d.bookmarks;
    if (typeof d.lastSlide === 'number') current = d.lastSlide;
  } catch (e) {}
}
function exportData() {
  const data = { version: 1, title: document.title, exportDate: new Date().toISOString(), slideCount: N,
    canvasSize: { w: 1, h: 1 }, pageIds, notes, understanding, bookmarks, strokes, boardStrokes, lastSlide: current };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `${deckName(document.title)}_study_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data.version) throw new Error('形式が不正です');
    if (!confirm('既存のデータに上書き（マージ）します。よろしいですか？')) return;
    const cw = (data.canvasSize && data.canvasSize.w) || 1, ch = (data.canvasSize && data.canvasSize.h) || 1;
    const den = src => Object.fromEntries(Object.entries(src || {}).map(([k, arr]) => [k, arr.map(s =>
      ({ ...s, points: s.points.map(p => ({ x: p.x > 1.5 ? p.x / cw : p.x, y: p.y > 1.5 ? p.y / ch : p.y })) }))]));
    if (data.notes) Object.assign(notes, data.notes);
    if (data.understanding) Object.assign(understanding, data.understanding);
    if (data.bookmarks) Object.assign(bookmarks, data.bookmarks);
    if (data.strokes) Object.assign(strokes, den(data.strokes));
    if (data.boardStrokes) Object.assign(boardStrokes, den(data.boardStrokes));
    saveLocal(); redrawStrokes();
    alert('読み込み完了しました (' + (data.exportDate || '') + ')');
  } catch (err) { alert('読み込めませんでした：' + err.message); }
}

/* ── 操作 ───────────────────────────────────────────────────────────────── */
$('prevBtn').onclick = prevSlide;
$('nextBtn').onclick = nextSlide;
$('drawBtn').onclick = () => setDraw(!drawMode);
$('saveBtn').onclick = exportData;
$('loadInput').onchange = e => { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; };
document.querySelectorAll('#drawbar [data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('#drawbar .sw').forEach(b => b.onclick = () => setColor(b.dataset.c));
$('undoBtn').onclick = undoStroke;
$('clearBtn').onclick = clearStrokes;
setTool('pen'); setColor('#e94560');

document.addEventListener('keydown', e => {
  if (!pdf || (e.target.closest && e.target.closest('input, textarea, select'))) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoStroke(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !drawMode)) { e.preventDefault(); nextSlide(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prevSlide(); }
  else if (k === 'Home') showSlide(0);
  else if (k === 'End') showSlide(N - 1);
  else if (k === 'd' || k === 'D') setDraw(!drawMode);
  else if (drawMode && (k === 'p' || k === 'P')) setTool('pen');
  else if (drawMode && (k === 'h' || k === 'H')) setTool('highlight');
  else if (drawMode && (k === 'e' || k === 'E')) setTool('eraser');
  else if (drawMode && (k === 'l' || k === 'L')) setTool('pointer');
});
// スワイプでページ送り（手書き中は、Pencil 使用時の指だけ）
let tx = 0, ty = 0, tSingle = false, tStylus = false;
$('stageArea').addEventListener('touchstart', e => {
  tSingle = e.touches.length === 1; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  tStylus = e.touches[0].touchType === 'stylus';
}, { passive: true });
$('stageArea').addEventListener('touchmove', e => { if (e.touches.length > 1) tSingle = false; }, { passive: true });
$('stageArea').addEventListener('touchend', e => {
  if (!pdf || !tSingle || tStylus || (drawMode && !penSeen)) return;
  if (window.visualViewport && window.visualViewport.scale > 1.05) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) dx > 0 ? prevSlide() : nextSlide();
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!pdf) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { sizeStage(); renderPage(); }, 120);
});

/* ── 起動 ───────────────────────────────────────────────────────────────── */
(function start() {
  if (!window.pdfjsLib) { $('opener').hidden = false; alert('PDF.js を読み込めませんでした（ネットワークを確認してください）'); return; }
  const file = params.get('file');
  if (file) { openPdf(file, decodeURIComponent(file.split('/').pop())); return; }
  const op = $('opener'); op.hidden = false;
  const openLocal = async f => { if (f) openPdf({ data: new Uint8Array(await f.arrayBuffer()) }, f.name); };
  $('pdfInput').onchange = e => openLocal(e.target.files[0]);
  op.addEventListener('dragover', e => { e.preventDefault(); op.classList.add('drag'); });
  op.addEventListener('dragleave', () => op.classList.remove('drag'));
  op.addEventListener('drop', e => { e.preventDefault(); op.classList.remove('drag'); openLocal(e.dataTransfer.files[0]); });
})();
</script>
